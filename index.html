<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merry Christmas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed canvas scene; a quiet title top-left and a bracketed ASCII control row at the bottom. Single dark look by choice. */
:root {
  --night: #070b16;
  --frost: #dbe8ff;
  --velvet: #8ec2f5;
  --dim: #6f83a8;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--frost); font-family: var(--mono); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.title {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 4px; pointer-events: none;
}
.title b { font-weight: 600; font-size: 13px; letter-spacing: 0.32em; color: var(--velvet); }
.title span { font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
.bar {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
}
.bar button { font: 12px/1 var(--mono); color: var(--velvet); background: none; border: 0; padding: 8px 0; cursor: pointer; white-space: nowrap; }
.bar button:hover { color: var(--frost); }
.bar button:focus-visible { outline: 1px dashed var(--velvet); outline-offset: 2px; }
.hint { font-size: 11px; color: var(--dim); pointer-events: none; }
@media (max-width: 520px) { .hint { display: none; } }
.code {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: clamp(120px, 21vh, 210px);
  display: grid; grid-template-rows: auto 1fr auto;
  background: rgba(5, 8, 16, 0.94);
  border-top: 1px solid #1a2540;
  font: 11.5px/1.55 var(--mono);
  color: #9fb0cc;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.code-head, .code-foot {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--dim); font-size: 11px;
}
.code-head { border-bottom: 1px solid #141d33; }
.code-head b { color: var(--frost); font-weight: 600; }
.code-foot { border-top: 1px solid #141d33; }
.code-foot .run::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6fd08c; margin-right: 6px; vertical-align: 1px; }
#src {
  margin: 0; overflow: hidden; white-space: pre;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px;
}
#src .ln { display: inline-block; width: 3.5ch; margin-right: 1.5ch; text-align: right; color: #3b4866; user-select: none; }
#src .k { color: #c792ea; } #src .s { color: #c3e88d; } #src .n { color: #f78c6c; } #src .c { color: #546480; font-style: italic; }
#src .cur { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: #8ec2f5; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #src .cur { animation: none; } }
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<canvas id="c" aria-label="An ASCII Christmas tree with blue velvet bows, silver and blue baubles, gold ribbon loops, warm lights, wrapped gifts, a rocking horse and falling snow"></canvas>
<div class="title"><b>MERRY CHRISTMAS</b></div>
<div class="bar">
  <button id="replay">[ replay ]</button>
  <span class="hint">drag to turn</span>
</div>
<div class="code" id="code" aria-hidden="true">
  <div class="code-head"><b>christmas_tree.js</b><span id="stats">rotation 0.00°&nbsp;&nbsp; lights 0&nbsp;&nbsp; ornaments 0</span></div>
  <pre id="src"></pre>
  <div class="code-foot"><span class="run">running</span><span id="fps">-- fps</span></div>
</div>

<script>
(() => {
const SOURCE = (document.currentScript && document.currentScript.textContent || '').replace(/^\s*\n/, '');
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const FAM = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

/* ---------- palettes ---------- */
function ramp(c0, c1, n) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const a = p(c0), b = p(c1), out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    out.push(`rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',')})`);
  }
  return out;
}
const theme = { needle: ramp('#0d2117', '#7fab7c', 10), bow: '#a6d0fb', bowTail: '#79aee6' };
const BASKET = ramp('#3a2a1a', '#c9a57a', 6);
const STRIPE_B = ramp('#244a72', '#9cc7ee', 5);
const STRIPE_W = ramp('#55606e', '#eef3fa', 5);
const TOILE_W = ramp('#5a6270', '#f2f4f2', 5);
const TOILE_INK = ramp('#2c4a6e', '#7fa3cc', 5);
const RIBBON = ramp('#6b5f4c', '#f1e4c6', 5);
const VELVET_BOX = ramp('#1a3354', '#5d8fc4', 5);
const OAK = ramp('#5c3c1e', '#f0cf98', 6);
const GOLD = ramp('#b47a1e', '#ffe27a', 6);
const SILVER = ramp('#3e454e', '#ffffff', 9);
const SPH_CH = '.:-=+*#%@';
const BAUBLE = {
  silver: ramp('#3c434d', '#ffffff', 7),
  gold:   ramp('#5e3f12', '#fff0b8', 7),
};
const BALL_ROWS = [[-1, -1, 1], [0, -2, 2], [1, -1, 1]];
const NEEDLE_CH = '.,:;=+*#%@';
const SHADE_CH = '.:-=+*#%';

/* ---------- scene geometry (world units; tree height = 1) ---------- */
const FLOOR = -0.19, TIERS = 7, R0 = 0.56;
const envR = y => R0 * (1 - y * 0.97) * (1 - 0.3 * ((y * TIERS) % 1));
const L = (() => { const v = [-0.55, 0.55, 0.65], m = Math.hypot(...v); return v.map(x => x / m); })();
const onTree = (y, a, k) => { const r = envR(y) * k; return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, a }; };

const needles = [];
for (let i = 0; i < 16000; i++) {
  const y = 1 - Math.sqrt(Math.random());
  const a = rnd(TAU);
  const inner = Math.random() < 0.8 ? 1 - rnd(0.09) : rnd(0.35, 0.85);
  const r = envR(y) * inner;
  const nm = Math.hypot(1, 0.5);
  needles.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r, nx: Math.cos(a) / nm, ny: 0.5 / nm, nz: Math.sin(a) / nm, k: rnd(), inner });
}

/* ornaments: velvet bows, silver mercury balls, small blue balls */
const orns = [];
const NB = 20;
for (let k = 0; k < NB; k++) {
  const y = 0.08 + 0.82 * (k + 0.5) / NB + rnd(-0.015, 0.015);
  orns.push({ ...onTree(y, k * 2.39996 + rnd(-0.2, 0.2), 1.03), type: 'bow', tail: 2 + Math.floor(rnd(3)), ph: rnd(TAU) });
}
const NBALL = 14;
for (let k = 0; k < NBALL; k++) {
  const u = (k + 0.5) / NBALL;
  const y = 0.07 + 0.8 * (1 - Math.sqrt(1 - u * 0.96));
  orns.push({ ...onTree(y, k * 2.39996 + 1.2, 1.02), type: 'silver', mat: k % 2 ? 'gold' : 'silver', ph: rnd(TAU) });
}
for (let k = 0; k < 34; k++) {
  const y = 0.04 + 0.86 * (1 - Math.sqrt(rnd()));
  orns.push({ ...onTree(y, rnd(TAU), 1.02), type: 'blue', ph: rnd(TAU) });
}
orns.sort((a, b) => b.z - a.z);

/* gold ribbon: separate draped loops, one per tier, each sweeping round as the tree reaches it */
const garland = [];
const LOOPS = 6;
for (let k = 0; k < LOOPS; k++) {
  const yk = (k + 0.14) / TIERS;
  const R = R0 * (1 - yk * 0.97) * (1 - 0.3 * 0.14) * 1.07;
  const beads = Math.round(420 * R);
  const swags = 6;
  for (let i = 0; i < beads; i++) {
    const s = i / beads, a = k * 1.1 + s * TAU;
    const f = (s * swags) % 1;
    const y = yk + 0.012 - 0.028 * Math.sin(f * Math.PI);
    garland.push({ x: Math.cos(a) * R, y, z: Math.sin(a) * R, nx: Math.cos(a), nz: Math.sin(a), s, k, yk, i, ph: rnd(TAU) });
  }
}

const lights = [];
for (let i = 0; i < 260; i++) {
  const y = 0.02 + 0.92 * (1 - Math.sqrt(Math.random()));
  lights.push({ ...onTree(y, rnd(TAU), rnd(0.96, 1.04)), ph: rnd(TAU), sp: rnd(0.8, 2.6) });
}

const basket = [];
for (let yi = 0; yi < 11; yi++) {
  for (let ai = 0; ai < 120; ai++) {
    const a = ai / 120 * TAU, t = yi / 10;
    const y = FLOOR + t * 0.2, r = 0.15 + 0.035 * t;
    const ch = yi === 10 ? '=' : ((ai + yi) % 2 ? '/' : '\\');
    basket.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r, nx: Math.cos(a), ny: 0, nz: Math.sin(a), ch });
  }
}

/* presents, after the reference wraps */
const CRINKLE = ramp('#16304f', '#7397c2', 5);
const SILVER_RIB = ramp('#5d646d', '#eef2f6', 5);
const TICK_NAVY = ramp('#141c33', '#4a5c8c', 5);
const TICK_W = ramp('#5c5f66', '#eceae4', 5);
const NAVY_RIB = ramp('#0b1226', '#33467a', 5);
const BLUE_RIB = ramp('#1f3d66', '#9cc7f2', 5);
const WHITE_RIB = ramp('#6a7280', '#f6f8fb', 5);
const STYLES = {
  toile:   { rib: BLUE_RIB, bow: BLUE_RIB,
             skin: () => Math.random() < 0.16 ? [TOILE_INK, Math.random() < 0.7 ? '^' : '*'] : [TOILE_W] },
  crinkle: { rib: SILVER_RIB, bow: SILVER_RIB, fish: true,
             skin: () => [CRINKLE, null, rnd(-0.25, 0.25)] },
  ticking: { rib: NAVY_RIB, bow: NAVY_RIB, card: true,
             skin: (u, v, nx) => [Math.floor((nx ? v : u) * 18) % 2 ? TICK_NAVY : TICK_W, '|'] },
  stripe:  { rib: WHITE_RIB, bow: WHITE_RIB,
             skin: (u, v, nx) => [Math.floor((nx ? v : u) * 10) % 2 ? STRIPE_B : STRIPE_W] },
  velvet:  { rib: SILVER_RIB, bow: SILVER_RIB,
             skin: () => [VELVET_BOX, null, rnd(-0.08, 0.08)] },
};
const gifts = [];
let giftN = 0;
function addGift(cx, cz, w, h, d, rot, style, y0 = 0) {
  const c = Math.cos(rot), s = Math.sin(rot), st8 = STYLES[style], gi = giftN++;
  const put = (lx, ly, lz, nx, ny, nz) => {
    const u = lx / w + 0.5, v = lz / d + 0.5;
    const onU = Math.abs(u - 0.5) < 0.085, onV = Math.abs(v - 0.5) < 0.085;
    const e = 0.012;
    const edge = ny ? (Math.abs(lx) > w / 2 - e || Math.abs(lz) > d / 2 - e)
      : (ly > h - e || ly < e || (nx ? Math.abs(lz) > d / 2 - e : Math.abs(lx) > w / 2 - e));
    const ribbon = ny ? (onU || onV) : nx ? onV : onU;
    let pal, ch = null, jit = 0;
    if (ribbon) { pal = st8.rib; ch = ny ? '#' : '|'; }
    else [pal, ch = null, jit = 0] = st8.skin(u, v, nx);
    if (edge && !ribbon) { jit -= ny ? -0.25 : 0.3; ch = ny ? '_' : (ly > h - e ? '=' : ch); }
    gifts.push({ gi, x: cx + lx * c - lz * s, y: FLOOR + y0 + ly, z: cz + lx * s + lz * c, nx: nx * c - nz * s, ny, nz: nx * s + nz * c, pal, ch, jit });
  };
  const st = 0.011;
  for (let a = -w / 2; a <= w / 2; a += st) for (let b = -d / 2; b <= d / 2; b += st) put(a, h, b, 0, 1, 0);
  for (let a = -w / 2; a <= w / 2; a += st) for (let y = 0; y <= h; y += st) { put(a, y, d / 2, 0, 0, 1); put(a, y, -d / 2, 0, 0, -1); }
  for (let b = -d / 2; b <= d / 2; b += st) for (let y = 0; y <= h; y += st) { put(w / 2, y, b, 1, 0, 0); put(-w / 2, y, b, -1, 0, 0); }
  gifts.push({ gi, x: cx, y: FLOOR + y0 + h + 0.02, z: cz, bowTop: st8.bow, fish: st8.fish, card: st8.card });
}

/* gifts and the rocking horse as pixel sprites: each cell is a solid block with a texture glyph,
   always facing the camera so their shapes stay readable */
function stackRows(boxes, opt) {
  const W = Math.max(...boxes.map(b => b.w)), rows = [];
  const bow = opt.bow || [];
  for (const line of bow) {
    const pad = Math.floor((W - line.length) / 2);
    rows.push(Array.from({ length: W }, (_, i) => { const c = line[i - pad]; return c && c !== ' ' ? ['bow', c] : null; }));
  }
  for (const b of boxes) {
    const pad = Math.floor((W - b.w) / 2), mid = Math.floor(W / 2);
    for (let r = 0; r < b.h; r++) {
      const row = new Array(W).fill(null);
      for (let i = 0; i < b.w; i++) {
        const x = pad + i, onRib = opt.ribbon && x === mid;
        let cell;
        if (onRib) cell = ['rib', '|'];
        else if (r === 0) cell = ['lid', '='];
        else if (opt.stitch && (r === 1 || r === b.h - 2) && i > 0 && i < b.w - 1) cell = ['stitch', '-'];
        else if (opt.stitch && (i === 1 || i === b.w - 2) && r > 0 && r < b.h - 1) cell = ['stitch', ':'];
        else if (opt.lidBand && r < 2) cell = ['lid', '='];
        else if (i === 0 || i === b.w - 1) cell = ['side', ':'];
        else { const h = (x * 37 + rows.length * 91) % 7; cell = ['body', '%#&%x#@'[h]]; }
        row[x] = cell;
      }
      rows.push(row);
    }
  }
  return rows;
}
const BOW_TINY = ['>o<'];
/* colored glyphs only, no blocks behind: [glyph colour] per part */
const MAT = {
  sky:    { body: '#a9cfee', side: '#7fa9cf', lid: '#d4e9fa', rib: '#ffffff', bow: '#ffffff' },
  white:  { body: '#e6ecf2', side: '#b4bfcb', lid: '#ffffff', rib: '#a9cfee', bow: '#cfe4f7' },
  silver: { body: '#c5ccd5', side: '#939ba6', lid: '#e8edf2', rib: '#9b3b4e', bow: '#c25a6e' },
  blush:  { body: '#e3b7b0', side: '#b98d87', lid: '#f2d3ce', rib: '#fff4e2', bow: '#fff4e2' },
};
const SPRITES = [
  { x: 0.0, z: 0.6, mat: 'sky', rows: stackRows([{ w: 11, h: 4 }], { ribbon: true, bow: BOW_TINY }) },
  { x: 0.52, z: -0.3, mat: 'white', rows: stackRows([{ w: 10, h: 3 }], { ribbon: true, bow: BOW_TINY }) },
  { x: -0.56, z: 0.22, mat: 'silver', rows: stackRows([{ w: 11, h: 4 }], { ribbon: true, bow: BOW_TINY }) },
  { x: -0.38, z: -0.5, mat: 'blush', rows: stackRows([{ w: 9, h: 3 }], { ribbon: true, bow: BOW_TINY }) },
  { x: 0.6, z: 0.14, mat: 'sky', rows: stackRows([{ w: 8, h: 3 }], { ribbon: true, bow: BOW_TINY }) },
];
SPRITES.forEach((sp, i) => { sp.gi = i; });
giftN = SPRITES.length;

/* rocking horse, light oak, head to the left; w wood, d darker mane/tail, e eye, h handle, s seat, r rocker */
const HORSE_MAP = [
  '   dd           ',
  '  wwdhh         ',
  ' ewwwd          ',
  'www  wsssssswd  ',
  '     ww    ww dd',
  'r    ww    ww  r',
  ' rrrrrrrrrrrrrr ',
];
const HORSE_MAT = { w: ['', '#d8b27c', '%'], d: ['', '#a77a45', '#'], e: ['', '#3a2412', '@'],
  h: ['', '#f0d6a6', '='], s: ['', '#ead0a0', '='], r: ['', '#c89a64', '~'] };
const HORSE = { x: -0.3, z: -0.58 };

/* ---------- soft props made of ellipsoid point clouds ---------- */
function gauss() { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); }
function ellip(out, { c, r, rz = 0, n, pal, ch, S = 1, color }) {
  const cz = Math.cos(rz), sz = Math.sin(rz);
  for (let i = 0; i < n; i++) {
    let dx = gauss(), dy = gauss(), dz = gauss();
    const m = Math.hypot(dx, dy, dz); dx /= m; dy /= m; dz /= m;
    const x = r[0] * dx, y = r[1] * dy, z = r[2] * dz;
    let nx = dx / r[0], ny = dy / r[1], nz = dz / r[2];
    const nm = Math.hypot(nx, ny, nz); nx /= nm; ny /= nm; nz /= nm;
    const X = x * cz - y * sz, Y = x * sz + y * cz;
    const NX = nx * cz - ny * sz, NY = nx * sz + ny * cz;
    const p = { x: (c[0] + X) * S, y: (c[1] + Y) * S, z: (c[2] + z) * S, nx: NX, ny: NY, nz, pal, ch };
    if (color) p.pal = color(X, Y, z);
    out.push(p);
  }
}

/* wooden rocking horse: light oak, side boards, curved rockers */
const horse = [];
{
  const S = 2.1, O = OAK;
  ellip(horse, { S, c: [-0.005, 0.072, 0], r: [0.066, 0.028, 0.02], n: 500, pal: O });
  ellip(horse, { S, c: [-0.012, 0.096, 0], r: [0.05, 0.006, 0.036], n: 300, pal: O });
  ellip(horse, { S, c: [0.046, 0.038, 0], r: [0.012, 0.034, 0.018], rz: -0.25, n: 170, pal: O });
  ellip(horse, { S, c: [-0.052, 0.038, 0], r: [0.012, 0.034, 0.018], rz: 0.3, n: 170, pal: O });
  ellip(horse, { S, c: [0.056, 0.118, 0], r: [0.018, 0.048, 0.016], rz: -0.35, n: 280, pal: O });
  ellip(horse, { S, c: [0.088, 0.152, 0], r: [0.034, 0.018, 0.015], rz: -0.55, n: 240, pal: O });
  ellip(horse, { S, c: [0.072, 0.156, 0], r: [0.004, 0.004, 0.036], n: 60, pal: O });
  ellip(horse, { S, c: [-0.074, 0.1, 0], r: [0.01, 0.03, 0.008], rz: 0.55, n: 90, pal: O });
  for (let i = 0; i < 40; i++) {
    const s = i / 39;
    horse.push({ x: (0.052 - s * 0.03) * S, y: (0.165 - s * 0.085) * S, z: 0, nx: -0.6, ny: 0.8, nz: 0, ch: i % 2 ? '|' : ':', pal: OAK[2], bias: 0.005 });
  }
  for (const zs of [-0.034, 0.034]) {
    for (let i = 0; i < 260; i++) {
      const x = rnd(-0.14, 0.14), y = 0.006 + 1.15 * x * x + rnd(0.012), z = zs + rnd(-0.007, 0.007);
      horse.push({ x: x * S, y: y * S, z: z * S, nx: 0, ny: 1, nz: Math.sign(zs) * 0.6, pal: O });
    }
  }
  for (const zs of [-1, 1]) horse.push({ x: 0.098 * S, y: 0.158 * S, z: zs * 0.017 * S, nx: 0, ny: 0, nz: zs, ch: '.', pal: '#2a1a0c', bias: 0.01 });
}

const faceOut = (x, z) => Math.atan2(z, x) - Math.PI / 2;
const props = [
];

/* floor: a ring of ribbon text */
const RING_TXT = 'MERRY CHRISTMAS . NOEL . ';
const RING_N = 128, RING_R = 0.98;
const ring = [];
for (let i = 0; i < RING_N; i++) {
  const a = -i / RING_N * TAU;
  ring.push({ x: Math.cos(a) * RING_R, y: FLOOR, z: Math.sin(a) * RING_R, ch: RING_TXT[i % RING_TXT.length], i });
}
const ground = [];
for (let i = 0; i < 1100; i++) {
  const a = rnd(TAU), r = 1.15 * Math.sqrt(Math.random());
  ground.push({ x: Math.cos(a) * r, y: FLOOR, z: Math.sin(a) * r, r });
}

/* ---------- viewport / grid ---------- */
let W, H, dpr, fs, cw, ch, cols, rows, scale, cx, baseY, AVAIL;
let zb, cb, colb, fillb;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fs = clamp(Math.min(W / 120, H / 62), 7.5, 12.5);
  ctx.font = `${fs}px ${FAM}`;

let theta = 0.6, spin = reduce ? 0 : 0.18, dragV = 0;

/* ---------- snow ---------- */

  // star: square gold pixels, each arm split into a light and a dark half like an embroidered patch
  if (starPx) {
    const [sx, sy, R, sIn] = starPx, r0 = R * 0.42, q = Math.max(2, Math.round(R / 10));
    const verts = [];
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r0 : R; verts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
    const inside = (x, y) => { let c = false; for (let i = 0, j = 9; i < 10; j = i++) { const [xi, yi] = verts[i], [xj, yj] = verts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
    const n = Math.ceil(R / q) + 1, sh = 0.08 * Math.sin(tt * 2);
    ctx.globalAlpha = sIn;
    for (let gy = -n; gy <= n; gy++) for (let gx = -n; gx <= n; gx++) {
      const x = (gx + 0.5) * q, y = (gy + 0.5) * q;
      if (!inside(x, y)) continue;
      const edge = !inside(x + q, y) || !inside(x - q, y) || !inside(x, y + q) || !inside(x, y - q);
      let phi = Math.atan2(y, x) + Math.PI / 2;
      const k = Math.round(phi / (TAU / 5)), d = phi - k * TAU / 5;
      const light = d < 0;
      ctx.fillStyle = edge ? '#b47a12' : light ? (sh > 0.04 ? '#fff1a8' : '#ffe27a') : '#e8a925';
      ctx.fillRect(Math.round(sx + gx * q), Math.round(sy + gy * q), q, q);
    }
    ctx.globalAlpha = 1;
  }

  // fireworks
  if (t > GEND + 4.8) {
    fwClock -= dt;
    if (fwClock <= 0) { launch(); fwClock = rnd(0.9, 1.8); }
  }
  ctx.font = `600 ${fs * 1.35}px ${FAM}`;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.y += r.vy * dt; r.vy += 60 * dt;
    if (r.vy > -40 || r.y <= r.ty) { burst(r); rockets.splice(i, 1); continue; }
    for (let k = 0; k < 4; k++) {
      ctx.globalAlpha = 0.8 - k * 0.2; ctx.fillStyle = r.color;
      ctx.fillText(k ? '.' : '|', r.x, r.y + k * ch * 0.6);
    }
  }
  ctx.font = `${fs}px ${FAM}`;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life -= dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    p.vx *= Math.pow(0.42, dt); p.vy = p.vy * Math.pow(0.42, dt) + 38 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const f = p.life / p.max;
    const v = Math.hypot(p.vx, p.vy) || 1;
    let ang = Math.atan2(p.vy, p.vx) * 180 / Math.PI; ang = (ang + 180) % 180;
    const c = ang < 22.5 || ang >= 157.5 ? '-' : ang < 67.5 ? '\\' : ang < 112.5 ? '|' : '/';
    const len = Math.min(7, 2 + v / 30);
    ctx.fillStyle = p.color;
    for (let k = 1; k <= len; k++) {
      ctx.globalAlpha = f * (1 - k / (len + 1)) * 0.85;
      ctx.fillText(c, p.x - p.vx / v * k * cw * 0.85 - cw * 0.3, p.y - p.vy / v * k * ch * 0.55);
    }
    ctx.globalAlpha = Math.min(1, f * 1.5) * (0.7 + 0.3 * Math.sin(tt * 25 + p.ph));
    ctx.fillText(p.tip ? 'o' : '*', p.x - cw * 0.3, p.y);
    if (p.tip && f > 0.3) { ctx.globalAlpha = f * 0.6; ctx.drawImage(p.sprite, p.x - cw * 1.7, p.y - cw * 1.1, cw * 3.4, cw * 3.4); }
  }
  for (let i = glitter.length - 1; i >= 0; i--) {
    const g = glitter[i];
    g.t += dt; g.y += 10 * dt;
    if (g.t > g.max) { glitter.splice(i, 1); continue; }
    if (g.t < 0) continue;
    ctx.globalAlpha = (1 - g.t / g.max) * (Math.sin(tt * 40 + g.ph) > 0.2 ? 1 : 0.15);
    ctx.fillStyle = '#fff3dc';
    ctx.fillText('.', g.x, g.y);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // snow, small and drifting
  ctx.font = `${fs * 0.85}px ${FAM}`;
  for (let i = 0; i < snow.length; i++) {
    const f = snow[i];
    f.y += f.vy * dt; f.ph += f.f * dt;
    if (f.y > H + 10) { snow[i] = newFlake(false); continue; }
    ctx.fillStyle = `rgba(222,236,255,${f.a})`;
    ctx.fillText(f.c, f.x + Math.sin(f.ph) * f.amp, f.y);
  }

  updateCode(now, dt, litCount);
  requestAnimationFrame(frame);
}

/* ---------- fireworks ---------- */
const FW_COLORS = [
  ['#ffd9a0', glowGold], ['#ffc8a2', glowGold], ['#fff4e2', glowSilver], ['#ffb9ae', glowGold], ['#e2ecff', glowCool],
];
let rockets = [], sparks = [], glitter = [], fwClock = 0;
function launch() {
  const n = Math.random() < 0.3 ? 2 + (Math.random() < 0.4) : 1;
  const side = Math.random() < 0.5 ? rnd(0.12, 0.3) : rnd(0.7, 0.88);
  for (let j = 0; j < n; j++) {
    const [color, sprite] = FW_COLORS[Math.floor(rnd(FW_COLORS.length))];
    rockets.push({ x: W * clamp(side + rnd(-0.08, 0.08), 0.05, 0.95), y: AVAIL * 0.95 + j * 30, vy: -rnd(330, 420) * Math.sqrt(AVAIL / 600),
      ty: AVAIL * rnd(0.1, 0.3), color, sprite });
  }
}
function burst(r) {
  const heart = false;
  const n = heart ? 60 : Math.round(rnd(90, 130)), sp = rnd(150, 210) * Math.sqrt(AVAIL / 600);
  for (let i = 0; i < n; i++) {
    let vx, vy;
    if (heart) {
      const a = i / n * TAU;
      vx = Math.sin(a) ** 3 * sp; vy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16 * sp;
    } else {
      const a = rnd(TAU), m = sp * (0.35 + 0.65 * Math.sqrt(Math.random()));
      vx = Math.cos(a) * m; vy = Math.sin(a) * m;
    }
    const max = rnd(1.4, 2.4);
    const white = Math.random() < 0.25;
    sparks.push({ x: r.x, y: r.y, vx, vy, life: max, max, color: white ? '#fff6e6' : r.color, sprite: r.sprite, tip: Math.random() < 0.45, ph: rnd(TAU) });
  }
  for (let i = 0; i < 40; i++) {
    const a = rnd(TAU), d = rnd(0.2, 1) * sp * 1.1;
    glitter.push({ x: r.x + Math.cos(a) * d, y: r.y + Math.sin(a) * d * 0.9, t: -rnd(0.6, 1.4), max: rnd(0.8, 1.6), ph: rnd(TAU) });
  }
}

/* ---------- code panel: types out this page's own script ---------- */
const srcEl = document.getElementById('src'), statsEl = document.getElementById('stats'), fpsEl = document.getElementById('fps');
const LINES = SOURCE.split('\n');
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const TOK = /(\/\/.*$|\/\*.*?\*\/)|('(?:\\.|[^'\\])*'?|"(?:\\.|[^"\\])*"?|`(?:\\.|[^`\\])*`?)|\b(const|let|for|of|if|else|return|function|new|continue|break|while|true|false|null|typeof)\b|\b(\d+(?:\.\d+)?)\b/g;
function hl(line) {
  let out = '', last = 0;
  line.replace(TOK, (m, c, s, k, n, i) => {
    out += esc(line.slice(last, i));
    out += `<span class="${c ? 'c' : s ? 's' : k ? 'k' : 'n'}">${esc(m)}</span>`;
    last = i + m.length;
    return m;
  });
  return out + esc(line.slice(last));
}
const HL = LINES.map(hl);
let typed = 0, shownKey = '', statT = 0, frames = 0;
function resetCode() { typed = 0; }
function updateCode(now, dt, lit) {
  typed += dt * (reduce ? 4000 : 520);
  let rem = Math.floor(typed), li = 0;
  while (li < LINES.length && rem > LINES[li].length) { rem -= LINES[li].length + 1; li++; }
  if (li >= LINES.length) { typed = 0; li = 0; rem = 0; }
  const lh = parseFloat(getComputedStyle(srcEl).lineHeight) || 18;
  const fit = Math.max(1, Math.floor(srcEl.clientHeight / lh) - 1);
  const key = li + ':' + rem;
  if (key !== shownKey) {
    shownKey = key;
    const from = Math.max(0, li - fit + 1);
    let html = '';
    for (let i = from; i <= li; i++) {
      const body = i < li ? HL[i] : hl(LINES[i].slice(0, rem)) + '<span class="cur"></span>';
      html += `<span class="ln">${i + 1}</span>${body}\n`;
    }
    srcEl.innerHTML = html;
  }
  frames++;
  if (now - statT > 250) {
    const deg = ((theta * 180 / Math.PI) % 360 + 360) % 360;
    const shown = orns.filter(o => o.y < (FLOOR + 1.2) && viewNZ(Math.cos(o.a), Math.sin(o.a)) > 0.1).length;
    statsEl.textContent = `rotation ${deg.toFixed(2)}°   lights ${lit}   ornaments ${shown}`;
    fpsEl.textContent = `${Math.round(frames * 1000 / (now - statT || 1))} fps`;
    statT = now; frames = 0;
  }
}

/* ---------- interaction ---------- */
let dragging = false, lastX = 0, lastT = 0, downX = 0, downT = 0;
cvs.addEventListener('pointerdown', e => {
  dragging = true; lastX = downX = e.clientX; lastT = downT = performance.now(); dragV = 0;
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(), dx = e.clientX - lastX;
  theta += dx * 0.008;
  dragV = clamp(dx * 0.008 / Math.max(0.008, (now - lastT) / 1000), -6, 6) - spin;
  lastX = e.clientX; lastT = now;
});
cvs.addEventListener('pointerup', e => {
  dragging = false;
  
});
cvs.addEventListener('pointercancel', () => { dragging = false; });

document.getElementById('replay').onclick = () => { t0 = performance.now(); resetCode(); rockets = []; sparks = []; glitter = []; };

addEventListener('resize', resize);
const start = () => { resize(); requestAnimationFrame(t => { last = t; frame(t); }); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
})();
</script>
